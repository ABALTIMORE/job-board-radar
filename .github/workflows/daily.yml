name: daily radar

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep seen.json and backlog.json between runs, so each run reports only new roles.
      - uses: actions/cache@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-

      - name: Run job-board-radar
        run: python job_board_radar.py

      # Show the list right on the run's page, so nobody has to download a file.
      - name: Show today's new jobs
        run: |
          if [ -f data/new_jobs.md ]; then cat data/new_jobs.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: new-jobs-${{ github.run_id }}
          path: data/new_jobs.md
